seed_everything: 0
trainer:
  accelerator: gpu
  devices: 1
  strategy: auto
  max_epochs: 20
  use_distributed_sampler: false
  limit_train_batches: 100
  log_every_n_steps: 1
  check_val_every_n_epoch: 1
  default_root_dir: ../logs
  accumulate_grad_batches: 1
  gradient_clip_val: 0.5
  precision: 32-true
model:
  forecaster:
    class_path: probts.model.forecaster.prob_forecaster.KGO.KGOModel
    init_args:
      dropout: 0.0
      num_blocks: 7
      input_patch_size: 8
      embedding_dim: 512
      kofm_dim: 128
      num_heads: 16
      num_train_samples: 4
      num_sampling: 100
      num_samples_chunk: 20
      conv1d_kernel_size: 4
      ffn_proj_factor: 1.0
      decoder_num_layers: 4
      hidden_mul: 1
  learning_rate: 0.001
  num_samples: 100
  quantiles_num: 20
data:
  data_manager:
    class_path: probts.data.data_manager.DataManager
    init_args:
      split_val: true
      scaler: standard
      dataset: traffic_nips
      context_length: 24
      prediction_length: 24
      path: ../datasets
  batch_size: 32
  test_batch_size: 8
  num_workers: 8
